<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiCam Controller</title>
<style>
  :root {
    --bg: #111;
    --panel: #1c1c1c;
    --panel-2: #252525;
    --text: #eee;
    --muted: #888;
    --accent: #5fb;
    --warn: #fa3;
    --err: #f55;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; margin: 0; background: var(--bg); color: var(--text); font-family:
          ui-monospace, "SF Mono", Menlo, monospace; }
  header { flex-shrink: 0; flex-wrap: wrap; padding: 12px 16px; background: var(--panel); display: flex; align-items: center; gap: 18px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 500; letter-spacing: 0.04em; }
  header .controls { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid #444;
    padding: 6px 14px; font: inherit; cursor: pointer; border-radius: 3px;
    transition: background 0.1s;
  }
  button:hover:not(:disabled) { background: #353535; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: #2a6; border-color: #3a7; }
  button.primary:hover { background: #3b7; }
  button.danger { background: #a33; border-color: #b44; }
  button.danger:hover { background: #b44; }

  #grid {
    display: grid; flex: 1; min-height: 0; padding: 12px; gap: 12px; overflow: auto;
    grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr));
    grid-auto-rows: minmax(160px, 1fr);
  }
  .slot {
    background: var(--panel); border-radius: 6px; overflow: hidden;
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
  }
  .slot-header {
    padding: 8px 12px; display: flex; flex-shrink: 0; flex-wrap: wrap; align-items: center; gap: 12px;
    background: var(--panel-2); border-bottom: 1px solid #333;
  }
  .slot-title { font-weight: 500; }
  .slot-meta { font-size: 11px; color: var(--muted); }
  .slot-state { font-size: 11px; padding: 2px 8px; border-radius: 10px;
                background: #333; }
  .slot-state.running { background: #1e5; color: #042; }
  .slot-state.reconnecting { background: var(--warn); color: #210; }
  .slot-state.dead { background: var(--err); color: #200; }

  .slot img {
    width: 100%; height: 0; flex: 1; min-height: 0; object-fit: contain; background: #000;
    display: block;
  }
  .slot-foot {
    padding: 8px 12px; display: flex; flex-shrink: 0; gap: 8px; align-items: center;
    background: var(--panel-2); border-top: 1px solid #333;
  }
  .recording-pill {
    background: #d33; color: #fff; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0.55; } }

  .notice { flex-shrink: 0; padding: 8px 16px; color: var(--err); background: var(--panel-2); }
  .notice[hidden] { display: none; }

  #burst-bar {
    flex-shrink: 0; padding: 8px 16px;
    background: var(--panel-2); border-top: 1px solid #333; display: none;
  }
  #burst-bar.active { display: block; }
  #burst-progress { background: #444; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  #burst-progress-fill { background: var(--err); height: 100%; width: 0%;
                          transition: width 100ms linear; }
</style>
</head>
<body>

<header>
  <h1>DiCam Controller</h1>
  <div class="controls">
    <button onclick="postBurst(1)">Burst 1s</button>
    <button onclick="postBurst(3)">Burst 3s</button>
    <button onclick="postBurst(5)">Burst 5s</button>
    <button class="primary" onclick="post('/api/record/start')">Record</button>
    <button class="danger" onclick="post('/api/record/stop')">Stop</button>
  </div>
</header>
<div id="command-error" class="notice" role="alert" hidden></div>
<div id="status-error" class="notice" role="alert" hidden></div>

<div id="grid">
  {{range .}}
  <div class="slot" id="slot-{{.}}">
    <div class="slot-header">
      <span class="slot-title">cam{{.}}</span>
      <span class="slot-meta" id="meta-{{.}}">…</span>
      <span class="slot-state" id="state-{{.}}">connecting</span>
    </div>
    <img id="preview-{{.}}" src="/video_feed/{{.}}" onerror="this.dataset.failed = 'true'" alt="cam {{.}} preview">
    <div class="slot-foot">
      <span id="fps-{{.}}" class="slot-meta">— fps</span>
      <span id="rec-{{.}}"></span>
    </div>
  </div>
  {{else}}
  <div class="slot"><div class="slot-header">No cameras configured</div></div>
  {{end}}
</div>

<div id="burst-bar">
  <span id="burst-label">Burst recording…</span>
  <div id="burst-progress"><div id="burst-progress-fill"></div></div>
</div>

<div id="connection-status" class="notice" role="status" aria-live="polite" hidden></div>

<script>
const streamGenerations = new Map();
let serverWasDown = false;
function showError(id, message) {
  const notice = document.getElementById(id);
  notice.textContent = message;
  notice.hidden = !message;
}

async function post(url, body = null) {
  const buttons = document.querySelectorAll('header button');
  buttons.forEach(button => { button.disabled = true; });
  showError('command-error', '');
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: body ? {'Content-Type': 'application/json'} : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const result = await r.json();
    if (!r.ok || result.error) {
      throw new Error(result.error || `HTTP ${r.status}`);
    }
    const results = Object.entries(result.results || result.cameras || {});
    if (!results.length) throw new Error('No cameras are ready for recording. Check camera connection and status.');
    const failures = results.filter(([, value]) => value.ok === false || value.started === false);
    if (failures.length) {
      throw new Error(failures.map(([slot, value]) => `cam${slot}: ${value.error || 'Command failed'}`).join('; '));
    }
    return result;
  } catch (e) {
    showError('command-error', `Command failed: ${e.message}`);
  } finally {
    buttons.forEach(button => { button.disabled = false; });
    await refresh();
  }
}
function postBurst(secs) {
  return post('/api/burst', {duration: secs});
}

async function refresh() {
  try {
    const r = await fetch('/api/status', {cache: 'no-store'});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    const lost = j.slots.filter(s => s.reachable === false);
    showError('connection-status', lost.length ? 'lost connection to camera' +
      (j.slots.length > 1 ? ` (${lost.map(s => s.host).join(', ')})` : '') : '');
    j.slots.forEach(s => {
      const preview = document.getElementById(`preview-${s.slot}`);
      if (preview && s.state === 'running') {
        const previous = streamGenerations.get(s.slot);
        if (serverWasDown || (previous !== undefined && previous !== s.stream_generation) || preview.dataset.failed === 'true') {
          preview.dataset.failed = 'false';
          preview.src = `/video_feed/${s.slot}?reconnect=${Date.now()}`;
        }
        streamGenerations.set(s.slot, s.stream_generation);
      }
      const meta = document.getElementById(`meta-${s.slot}`);
      if (meta) meta.textContent = `${s.host} · ${s.model || '?'} · fw ${s.firmware || '?'} · ${s.mode_name}`;
      const state = document.getElementById(`state-${s.slot}`);
      if (state) {
        state.textContent = s.error ? `${s.state}: ${s.error}` : s.state;
        state.className = `slot-state ${s.state}`;
      }
      const fps = document.getElementById(`fps-${s.slot}`);
      if (fps) fps.textContent = `${s.fps_actual || 0} fps · last frame ${s.last_frame_age_s ?? '—'}s ago`;
      const rec = document.getElementById(`rec-${s.slot}`);
      if (rec) rec.innerHTML = s.recording ? '<span class="recording-pill">● REC</span>' : '';
    });

    // Burst progress bar
    const bar = document.getElementById('burst-bar');
    const fill = document.getElementById('burst-progress-fill');
    const lbl = document.getElementById('burst-label');
    if (j.burst.active) {
      bar.classList.add('active');
      const pct = Math.min(100, (j.burst.elapsed_s / j.burst.duration_s) * 100);
      fill.style.width = `${pct}%`;
      const remaining = Math.max(0, j.burst.duration_s - j.burst.elapsed_s).toFixed(1);
      lbl.textContent = `Burst recording — ${remaining}s remaining`;
    } else {
      bar.classList.remove('active');
    }
    serverWasDown = false;
    showError('status-error', '');
  } catch (e) {
    serverWasDown = true;
    showError('status-error', 'Server is down');
  }
}
async function pollStatus() {
  await refresh();
  setTimeout(pollStatus, 500);
}
pollStatus();
</script>
</body>
</html>
